<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="知序，一处安静的个人知识空间。本地化知识库平台高保真交互原型。">
    <title>知序 · 让知识，重新相遇</title>
    <style>
        :root {
            --bg: #fafaf8;
            --paper: #fff;
            --side: #f2f3ee;
            --ink: #29392f;
            --text: #475249;
            --muted: #65725e;
            --line: #e5e8df;
            --sage: #657d62;
            --sage-dark: #435c42;
            --sage-tint: #e7ecdf;
            --oat: #f4efe4;
            --blue: #eaf0f2;
            --danger: #a04e43;
            --shadow: 0 6px 30px #29392f06;
            --serif: Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
            --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            background: var(--bg);
            -webkit-font-smoothing: antialiased
        }

        button, input, textarea, select {
            font: inherit
        }

        button, a, input, textarea, select {
            -webkit-tap-highlight-color: transparent
        }

        button {
            cursor: pointer;
            color: inherit
        }

        button {
            border: 0;
            background: none
        }

        a {
            color: inherit
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .45
        }

        button, input, textarea, select, a {
            outline-offset: 4px
        }

        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--sage)
        }

        input:focus, textarea:focus, select:focus {
            outline: 2px solid #91a48a44;
            outline-offset: 1px
        }

        button {
            transition: background .18s, color .18s, border-color .18s, box-shadow .18s
        }

        button:hover {
            color: var(--ink)
        }

        svg {
            width: 20px;
            height: 20px;
            flex: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            vertical-align: middle
        }

        h1, h2, h3, h4, p {
            margin: 0
        }

        h1, h2, h3 {
            color: var(--ink)
        }

        small {
            font-size: 12px
        }

        .app {
            display: flex;
            height: 100dvh;
            min-height: 560px;
            overflow: hidden
        }

        .sidebar {
            width: 242px;
            flex: none;
            background: var(--side);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            padding: 31px 18px 16px;
            z-index: 35
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 13px 32px
        }

        .brand-mark {
            width: 33px;
            height: 36px;
            color: var(--sage-dark)
        }

        .brand-name {
            font-family: var(--serif);
            font-size: 25px;
            letter-spacing: 4px;
            font-weight: 600
        }

        .brand-en {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--muted);
            margin-top: 2px
        }

        .new-search {
            height: 43px;
            border: 1px solid #cfd8c8;
            background: #e8eddf;
            border-radius: 7px;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 0 14px;
            color: var(--sage-dark);
            font-weight: 600
        }

        .new-search:hover {
            background: #dce5d4
        }

        .shortcut-key {
            font-size: 11px;
            color: #65725e;
            margin-left: auto;
            font-weight: 400;
            border: 1px solid #ccd5c5;
            padding: 1px 4px;
            border-radius: 3px
        }

        .side-scroll {
            overflow: auto;
            flex: 1;
            padding-top: 24px
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 1px;
            color: #65725e;
            padding: 0 13px;
            margin: 0 0 9px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .section-label button {
            padding: 3px;
            display: grid;
            place-items: center
        }

        .section-label svg {
            width: 15px;
            height: 15px
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 13px;
            margin: 3px 0;
            border-radius: 6px;
            text-align: left;
            line-height: 20px;
            font-size: 13px
        }

        .nav-item svg {
            width: 17px;
            height: 17px;
            color: #65725e
        }

        .nav-item:hover {
            background: #e8ebe2
        }

        .nav-item.active {
            background: #e3e9db;
            color: var(--sage-dark)
        }

        .nav-item .count {
            margin-left: auto;
            color: #65725e;
            font-size: 11px
        }

        .side-subtitle {
            font-size: 10px;
            letter-spacing: .8px;
            padding: 17px 13px 5px;
            color: #65725e
        }

        .history-label {
            margin-top: 31px
        }

        .history-item {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            padding: 10px 13px;
            width: 100%;
            text-align: left;
            border-radius: 5px
        }

        .history-item:hover, .history-item.active {
            background: #e7ebe2
        }

        .history-item:before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #a8b39d;
            margin-right: 10px;
            vertical-align: 2px
        }

        .side-bottom {
            padding-top: 20px
        }

        .local-note {
            padding: 15px 13px;
            background: #ebeee5;
            border: 1px solid #e1e6d9;
            border-radius: 7px;
            margin-bottom: 15px
        }

        .local-note strong {
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #5e7055
        }

        .local-note svg {
            width: 14px;
            height: 14px
        }

        .local-note p {
            font-size: 10px;
            color: #65725e;
            line-height: 1.8;
            margin-top: 5px
        }

        .storage-track {
            height: 3px;
            background: #dde3d5;
            margin-top: 10px;
            border-radius: 8px
        }

        .storage-track span {
            display: block;
            width: 19%;
            height: 100%;
            background: #a9b899
        }

        .settings-nav {
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .settings-nav button {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            padding: 9px 12px;
            border-radius: 5px
        }

        .settings-nav button:hover {
            background: #e4e9dd
        }

        .settings-nav small {
            font-size: 10px;
            color: #65725e;
            padding-right: 9px
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative
        }

        .topbar {
            height: 76px;
            flex: none;
            border-bottom: 1px solid #e9ebe3;
            padding: 0 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafaf8eb;
            gap: 12px
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 13px;
            font-size: 12px
        }

        .breadcrumb span:first-of-type {
            color: #65725e
        }

        .breadcrumb .slash {
            color: #65725e
        }

        .breadcrumb svg {
            width: 17px;
            height: 17px
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 20px
        }

        .local-badge {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #65725e
        }

        .dot {
            height: 5px;
            width: 5px;
            background: #809774;
            border-radius: 50%;
            display: inline-block
        }

        .avatar {
            height: 31px;
            width: 31px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #e9eddf;
            border: 1px solid #dde4d4;
            color: #617352;
            font-size: 12px
        }

        .avatar:hover {
            background: #dde5d3
        }

        .mobile-menu {
            display: none
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: inline-grid;
            place-items: center;
            border-radius: 5px
        }

        .icon-btn:hover {
            background: #edf0e8
        }

        .workspace {
            flex: 1;
            min-height: 0;
            display: flex;
            position: relative
        }

        .chat-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column
        }

        .chat-scroll {
            flex: 1;
            overflow: auto;
            scroll-behavior: smooth;
            padding: 0 40px
        }

        .home {
            max-width: 838px;
            margin: 0 auto;
            padding: 44px 0 24px;
            animation: rise .55s ease both
        }

        .hero {
            text-align: center;
            position: relative
        }

        .hero-art {
            width: 154px;
            height: 107px;
            margin: 0 auto 12px;
            display: block;
            overflow: visible
        }

        .eyebrow {
            font-family: Georgia, serif;
            font-size: 9px;
            letter-spacing: 3.1px;
            color: #65725e;
            margin-bottom: 16px
        }

        .hero h1 {
            font-family: var(--serif);
            font-size: 36px;
            font-weight: 400;
            letter-spacing: 3px;
            line-height: 1.5
        }

        .hero h1 span {
            color: #65725e
        }

        .hero-description {
            font-size: 12px;
            color: #65725e;
            line-height: 1.9;
            margin-top: 12px;
            letter-spacing: .3px
        }

        .quick-actions {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 14px;
            margin-top: 33px
        }

        .quick-card {
            text-align: left;
            padding: 21px 19px 18px;
            border: 1px solid var(--line);
            background: #fff9;
            border-radius: 8px;
            box-shadow: 0 3px 12px #33412b02;
            position: relative
        }

        .quick-card:hover {
            border-color: #b8c7aa;
            background: white;
            box-shadow: 0 8px 20px #33412b06
        }

        .quick-icon {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            background: #eaf0e3;
            display: grid;
            place-items: center;
            color: #65725e;
            margin-bottom: 15px
        }

        .quick-card:nth-child(2) .quick-icon {
            background: #edf0f1;
            color: #65725e
        }

        .quick-card:nth-child(3) .quick-icon {
            background: #f3eee4;
            color: #65725e
        }

        .quick-card h2 {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 7px
        }

        .quick-card p {
            font-size: 11px;
            color: #65725e;
            line-height: 1.7
        }

        .quick-card .arrow {
            position: absolute;
            width: 15px;
            height: 15px;
            right: 17px;
            top: 24px;
            color: #65725e;
            transition: transform .2s
        }

        .quick-card:hover .arrow {
            transform: translateX(3px)
        }

        .suggestions {
            margin-top: 29px
        }

        .micro-heading {
            font-size: 11px;
            color: #65725e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            letter-spacing: .3px
        }

        .micro-heading .icon-btn {
            height: 22px;
            width: 22px
        }

        .micro-heading svg {
            height: 13px;
            width: 13px
        }

        .suggestion-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .suggestion {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 11px;
            border: 1px solid #e7e9e1;
            background: #f6f7f1;
            border-radius: 5px;
            font-size: 11px;
            line-height: 1.5;
            color: #65725e
        }

        .suggestion svg {
            width: 13px;
            height: 13px;
            opacity: .75
        }

        .suggestion:hover {
            background: #eaf0e2;
            border-color: #cbd7bf
        }

        .recent-docs {
            margin-top: 29px;
            padding-top: 20px;
            border-top: 1px solid var(--line)
        }

        .recent-doc-list {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 16px
        }

        .recent-doc {
            display: flex;
            text-align: left;
            gap: 10px;
            align-items: center;
            min-width: 0;
            padding: 8px 0;
            border-radius: 4px
        }

        .recent-doc:hover {
            background: #f0f3e9
        }

        .file-icon {
            width: 29px;
            height: 35px;
            display: grid;
            place-items: center;
            background: #f3eee4;
            color: #65725e;
            border: 1px solid #e9e2d4;
            border-radius: 3px;
            flex: none
        }

        .file-icon svg {
            width: 16px;
            height: 16px
        }

        .file-icon.md {
            background: #eaf0e6;
            color: #65725e;
            border-color: #dfe7d9
        }

        .file-icon.png {
            background: #eaf0f1;
            color: #65725e;
            border-color: #dfe7e8
        }

        .recent-doc div:last-child {
            min-width: 0
        }

        .recent-doc strong {
            display: block;
            font-weight: 400;
            color: #66715d;
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .recent-doc small {
            display: block;
            font-size: 9px;
            color: #65725e;
            margin-top: 6px
        }

        .composer-area {
            padding: 15px 40px 16px;
            flex: none;
            background: linear-gradient(0deg, var(--bg) 92%, #fafaf800)
        }

        .composer-wrap {
            max-width: 838px;
            margin: 0 auto;
            position: relative
        }

        .composer {
            border: 1px solid #dce2d3;
            background: #fff;
            border-radius: 10px;
            padding: 13px 16px 11px;
            box-shadow: 0 6px 24px #39463206;
            transition: border .2s, box-shadow .2s;
            position: relative
        }

        .composer:focus-within {
            border-color: #a6b99b;
            box-shadow: 0 5px 25px #3946320a
        }

        .composer.dragging {
            border: 1px dashed var(--sage);
            background: #f0f5e9
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            min-height: 25px;
            align-items: center
        }

        .chip {
            padding: 4px 8px;
            display: flex;
            gap: 6px;
            align-items: center;
            background: #f0f3e9;
            border: 1px solid #e5eadd;
            border-radius: 4px;
            color: #65725e;
            font-size: 10px
        }

        .chip svg {
            width: 12px;
            height: 12px
        }

        .chip.skill-chip {
            background: #f5f5f0;
            color: #65725e;
            border-color: #eaece4
        }

        .chip:hover {
            background: #e4ebd9
        }

        .query {
            width: 100%;
            height: 49px;
            max-height: 120px;
            resize: none;
            border: 0;
            padding: 15px 0 5px;
            line-height: 1.7;
            color: var(--ink);
            font-size: 13px;
            background: transparent;
            outline: none !important
        }

        .query::placeholder {
            color: #65725e
        }

        .composer-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 3px
        }

        .composer-left, .composer-right {
            display: flex;
            align-items: center;
            gap: 7px
        }

        .add-btn {
            width: 29px;
            height: 29px;
            border: 1px solid #e7e9e1;
            border-radius: 5px;
            display: grid;
            place-items: center;
            color: #65725e
        }

        .add-btn svg {
            width: 16px;
            height: 16px
        }

        .add-btn:hover {
            background: #f0f3ea
        }

        .text-btn {
            font-size: 11px;
            color: #65725e;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 7px;
            border-radius: 4px;
            white-space: nowrap
        }

        .text-btn svg {
            width: 13px;
            height: 13px
        }

        .text-btn:hover {
            background: #f1f4eb
        }

        .model-btn {
            font-size: 10px
        }

        .mode-btn {
            color: #53694a
        }

        .send {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            background: #74866a;
            color: white;
            border-radius: 6px;
            margin-left: 5px
        }

        .send svg {
            width: 18px;
            height: 18px
        }

        .send:hover {
            background: #526b46;
            color: white
        }

        .send:disabled {
            background: #b7c2af;
            opacity: .7
        }

        .vline {
            width: 1px;
            height: 13px;
            background: #e4e8dd;
            margin: 0 2px
        }

        .composer-caption {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 11px;
            font-size: 9px;
            color: #65725e;
            padding: 0 2px
        }

        .composer-caption span {
            display: flex;
            align-items: center;
            gap: 5px
        }

        .composer-caption svg {
            width: 11px;
            height: 11px
        }

        .composer-caption kbd {
            font: inherit;
            color: #65725e
        }

        .popover {
            display: none;
            position: absolute;
            z-index: 45;
            bottom: calc(100% + 7px);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 9px;
            box-shadow: 0 12px 45px #29392f14;
            padding: 7px;
            min-width: 230px;
            animation: rise .18s ease
        }

        .popover.open {
            display: block
        }

        .popover.scope {
            left: 0;
            bottom: calc(100% + 7px);
            width: 285px
        }

        .popover.add, .popover.skills {
            left: 0
        }

        .popover.mode, .popover.model {
            right: 0
        }

        .popover-title {
            font-size: 11px;
            color: #65725e;
            padding: 9px 10px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 4px;
            letter-spacing: .5px
        }

        .menu-option {
            width: 100%;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            text-align: left;
            border-radius: 5px;
            font-size: 12px
        }

        .menu-option:hover {
            background: #f1f4eb
        }

        .menu-option.active {
            background: #edf2e6;
            color: var(--sage-dark)
        }

        .menu-option svg {
            width: 16px;
            height: 16px
        }

        .menu-option .description {
            display: block;
            font-size: 10px;
            color: #65725e;
            margin-top: 4px;
            line-height: 1.6
        }

        .menu-option .tick {
            margin-left: auto;
            color: #65725e
        }

        .menu-option label {
            cursor: pointer;
            flex: 1
        }

        .menu-option input {
            accent-color: var(--sage);
            width: 14px;
            height: 14px
        }

        .menu-footer {
            font-size: 10px;
            color: #65725e;
            padding: 10px;
            border-top: 1px solid var(--line);
            line-height: 1.7
        }

        .model-tier {
            display: flex;
            gap: 5px;
            padding: 10px
        }

        .model-tier button {
            background: #f2f4ed;
            border-radius: 4px;
            flex: 1;
            font-size: 11px;
            padding: 7px
        }

        .model-tier button.active {
            background: #dfe8d5;
            color: var(--sage-dark)
        }

        .attachment {
            display: flex;
            gap: 8px;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px;
            margin: 8px 0;
            background: #f7f9f3;
            width: fit-content;
            font-size: 11px
        }

        .attachment img {
            width: 34px;
            height: 34px;
            object-fit: cover;
            border-radius: 3px
        }

        .attachment button {
            display: grid;
            place-items: center
        }

        .attachment svg {
            width: 13px;
            height: 13px
        }

        .message-list {
            max-width: 838px;
            margin: 0 auto;
            padding: 30px 0 40px
        }

        .message {
            margin: 0 0 30px;
            animation: rise .3s ease both
        }

        .message-user {
            display: flex;
            justify-content: flex-end
        }

        .user-bubble {
            background: #edf1e6;
            border: 1px solid #e3e9da;
            padding: 13px 18px;
            border-radius: 12px 12px 3px 12px;
            max-width: 85%;
            font-size: 13px;
            line-height: 1.8;
            color: #4f6347;
            overflow-wrap: anywhere
        }

        .user-bubble small {
            display: block;
            font-size: 9px;
            color: #65725e;
            margin-top: 7px
        }

        .user-bubble img {
            display: block;
            max-height: 130px;
            max-width: 100%;
            border-radius: 5px;
            margin-bottom: 8px
        }

        .answer-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #4e6845;

        .busy-line {
            height: 2px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            overflow: hidden
        }

        .busy-line:after {
            content: "";
            position: absolute;
            width: 30%;
            height: 2px;
            animation: scan 1s ease-in-out infinite;
            background: #a6b98f
        }

        @keyframes fade {
            from {
                opacity: 0
            }
            to {
                opacity: 1
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(9px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes slideIn {
            from {
                opacity: .3;
                transform: translateX(20px)
            }
            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        @keyframes breathe {
            0%, 80%, 100% {
                opacity: .3;
                transform: translateY(0)
            }
            40% {
                opacity: 1;
                transform: translateY(-3px)
            }
        }

        @keyframes progress {
            from {
                width: 2%
            }
            to {
                width: 100%
            }
        }

        @keyframes scan {
            from {
                left: -30%
            }
            to {
                left: 100%
            }

        if (m.type === 'user') return `<div class="message message-user"><div class="user-bubble">${m.image ? `<img src="${m.image}" alt="用于以图搜图的查询图片">` : ''}${esc(m.text).replace(/\n/g, '<br>')}<small>${esc(m.scope)} · ${esc(m.mode)}</small></div></div>`;
        let body = '';
        const found = (m.ids || []).map(id => docs.find(d => d.id === id)).filter(Boolean);
        if (m.type === 'results') body = `<p class="result-summary">在${esc(m.scope)}中找到 <strong>${found.length} 份相关资料</strong><br><small>${esc(m.mode)} · 以下为预置资料的交互演示</small></p>${found.map((d, i) => d.status === '已删除' ? `<div class="empty-result"><p>原文已删除，历史记录保留</p></div>` : resultCard(d, m.query, m.mode, i)).join('')}${m.web ? networkHTML() : ''}`;
        if (m.type === 'answer') body = `<div class="answer-content">${m.answer}</div><p class="sources-title">引用来源 · 点击核对原文</p><div class="citation-grid">${found.map((d, i) => citation(d, i)).join('')}</div>${m.web ? networkHTML() : ''}<div class="response-meta">示例模型响应 · ${esc(m.model || 'Qwen3')}<span style="margin-left:auto"></span><button data-action="copy-answer" data-id="${m.id}" aria-label="复制回答">${icon('copy')}</button><button data-action="feedback" data-id="${m.id}" class="${m.feedback ? 'selected' : ''}" aria-label="这份回答有帮助">${icon('like')}</button></div>`;
        if (m.type === 'guide') body = `<div class="answer-content"><p>${esc(m.text)}</p></div>${m.done ? '<p class="table-note">已完成本轮引导</p>' : `<div class="guide-options">${m.options.map(o => `<button data-action="guide-choice" data-id="${m.id}" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div><button class="guide-skip" data-action="guide-skip" data-id="${m.id}">跳过引导，直接搜 ${icon('arrow')}</button>`}`;
        if (m.type === 'empty') body = `<div class="empty-result">${icon('search')}<h3>${m.rag ? '未找到足够的依据' : '没有找到相关资料'}</h3><p>${esc(m.text)}</p><div class="guide-options" style="justify-content:center"><button data-action="broaden" data-query="${esc(m.query)}">扩大范围并试试模糊检索</button><button data-action="upload">补充资料</button></div></div>`;
        if (m.type === 'note') body = `<div class="info-banner">${icon('shield')}<span>${esc(m.text)}</span></div>`;
        return `<div class="message">${brandMini()}${body}</div>`;
    }

    function networkHTML() {
        return `<div class="network-block"><span class="tag blue">来自网络</span><p>当前为离线交互原型，尚未接入网络搜索服务。联网后，补充结果将在这里独立展示，不计入 RAG 引用来源。</p></div>`
    }

    function syncSession() {
        if (!current.messages.length) return;
        const c = JSON.parse(JSON.stringify(current));
        c.messages = c.messages.map(m => {
            const {image, ...rest} = m;
            return rest
        });
        sessions = sessions.filter(s => s.id !== current.id);
        sessions.unshift(c);
        sessions = sessions.slice(0, 16);
        persist();
        renderNav()
    }

    function addMessage(m) {
        current.messages.push({id: uuid(), ...m})
    }

    function available() {
        return docs.filter(d => d.status === '可用' && (!current.scope.length || current.scope.includes(d.lib)))
    }

    function retrieve(q, mode) {
        let pool = available(), s = q.toLowerCase().trim();
        if (current.skills.includes('图片搜索')) pool = pool.filter(d => d.ext === 'png' || d.tags.includes('图片'));
        if (attachment?.image) return pool.filter(d => d.ext === 'png').slice(0, 3);
        if (!s) return [];
        let cleaned = s.replace(/帮我|找一下|帮忙|我想|请问|关于|相关资料|帮|我的|一张|一个|如何|什么|哪些|怎么|可以|有没有|请|[？?]/g, '').trim();
        if (mode === '精确检索') return pool.filter(d => (d.title + d.text + d.tags).toLowerCase().includes(cleaned)).slice(0, 5);
        const lexicon = ['渐进式披露', '渐进', '披露', '认知', '负担', '设计', '简约', '极简', '留白', '色彩', '参考图', '图片', '图内文字', 'ocr', '多模态', '向量', '语义', '关键字', '混合', '重排', '可信', '引用', '出处', '证据', 'rag', 'mcp', '本地', '知识管理', '管理', '笔记', '整理', '学习', '阅读', '检索', '模型', '扫描', '板书'];
        let tokens = lexicon.filter(t => s.includes(t));
        if (!tokens.length) tokens = s.match(/[a-z0-9]{2,}/g) || [];
        if (/可信|出处|证据|引用/.test(s)) tokens.push('可信', '引用', '证据');
        if (/简单|复杂|认知/.test(s)) tokens.push('渐进', '披露', '认知');
        if (/图片|参考图|以图|画面|极简|截图/.test(s)) tokens.push('图片', '极简');
        if (/记忆|回忆|模糊/.test(s)) tokens.push('语义');
        if (/知识管理|整理|学习/.test(s)) tokens.push('管理', '笔记');
        tokens = [...new Set(tokens)];
        return pool.map(d => ({
            d,
            score: tokens.reduce((n, t) => n + (d.title.toLowerCase().includes(t) ? 4 : d.tags.toLowerCase().includes(t) ? 2 : d.text.toLowerCase().includes(t) ? 1 : 0), 0)
        })).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, mode === '模糊检索' ? 5 : 3).map(x => x.d);
    }

    function buildAnswer(q, found) {
        let cites = (i) => `<button class="inline-cite" data-action="preview" data-id="${found[i].id}" aria-label="查看引用${i + 1}">${i + 1}</button>`;
        if (/可信|引用|证据|出处/.test(q) && found.some(d => d.id === 'd1')) {
            let a = found.findIndex(d => d.id === 'd1'), b = found.findIndex(d => d.id === 'd5');
            return `<p>让知识检索更可信，关键是让“找到什么”和“依据在哪里”始终清晰。结合已有资料，可以从三个方面着手：</p><h3>01 · 兼顾准确匹配与语义理解</h3><p>融合关键字与语义检索：用关键字找到编号和术语，用语义找回不同措辞下的相近内容。${cites(a)}${b >= 0 ? cites(b) : ''}</p><h3>02 · 让每条结论都能回到原文</h3><p>在答案中附上页级或分块级引用。点击引用，即可在侧边预览中核对原始内容，保留完整的阅读上下文。${cites(a)}</p><h3>03 · 依据不足时，明确告诉用户</h3><p>没有足够的支撑资料时，说明证据不足，并建议扩大范围或补充文档，避免生成没有出处的答案。${cites(a)}</p>`
        }
        return `<p>根据当前范围内的示例资料，与“${esc(q)}”相关的内容如下：</p>${found.map((d, i) => `<h3>${String(i + 1).padStart(2, '0')} · ${esc(d.title)}</h3><p>${esc(d.text || '该上传项尚未接入真实内容解析，无法生成有依据的回答。')}${cites(i)}</p>`).join('')}<p class="table-note">以上为基于预置片段的演示汇总，未调用真实语言模型。</p>`
    }

    async function sendQuery(override) {
        if (busy) return;
        const q = (override ?? $('#query').value).trim();
        if (!q && !attachment) {
            toast('先写下你想找的内容');
            return
        }
        if (q.length > 2000) {
            toast('问题较长，请控制在 2000 字以内', true);
            return
        }
        if (current.id === 'new') current.id = uuid();
        const query = q || (attachment ? '查找与这张图片相似的内容' : '');
        const scope = current.scope.length ? current.scope.map(libName).join('、') : '全部知识库';
        if (current.title === '新检索') current.title = query.slice(0, 22);
        const picture = attachment?.dataUrl;
        addMessage({type: 'user', text: query, scope, mode: guide ? '引导补充' : current.mode, image: picture});
        $('#query').value = '';
        if (guide) {
            guide.answers.push(query);
            await advanceGuide();
            return
        }
        if (current.mode === '引导检索') {
            guide = {query, answers: [], round: 1};
            addMessage({
                type: 'guide',
                text: '为了更快找到你需要的资料，你更想了解哪一类内容？',
                options: ['概念与定义', '方法与实践', '图片与图表']
            });
            attachment = null;
            renderAttachment();
            renderChat(true);
            syncSession();
            return
        }
        await executeQuery(query, current.mode, scope);
    }

    async function executeQuery(query, mode, scope) {
        busy = true;
        closePopover();
        renderChat(true);
        const imageQuery = !!attachment?.image;
        let found = retrieve(query, mode).filter(d => mode !== 'RAG 检索' || d.text);
        if (mode === 'RAG 检索' && /可信|引用|证据|出处/.test(query) && found.some(d => d.id === 'd1')) found = found.filter(d => ['d1', 'd5'].includes(d.id));
        const responseModel = current.model, responseWeb = current.skills.includes('联网搜索');
        attachment = null;
        renderAttachment();
        await new Promise(r => setTimeout(r, 650));
        const hasContent = available().length > 0;
        if (!found.length) {
            addMessage({
                type: 'empty',
                query,
                rag: mode === 'RAG 检索',
                text: !hasContent ? '当前知识库暂无可用内容。上传资料并完成索引后，再开始检索。' : mode === 'RAG 检索' ? '当前示例资料不足以支持这个问题，因此不生成答案。可扩大范围、调整问法，或补充相关文档。' : '试试更短的关键词、切换模糊检索，或检查当前知识库范围。'
            })
        } else if (mode === 'RAG 检索') {
            addMessage({
                type: 'answer',
                query,
                ids: found.map(d => d.id),
                answer: buildAnswer(query, found),
                scope,
                model: responseModel,
                web: responseWeb
            })
        } else {
            addMessage({
                type: 'results',
                query,
                ids: found.map(d => d.id),
                scope,
                mode: imageQuery ? '以图搜图 · 示例相似结果' : mode,
                web: responseWeb
            })
        }
        busy = false;
        guide = null;
        renderChat(true);
        syncSession()
    }

    async function advanceGuide() {
        const last = current.messages.filter(m => m.type === 'guide').at(-1);
        if (last) last.done = true;
        if (guide.round === 1) {
            guide.round = 2;
            addMessage({
                type: 'guide',
                text: '还想按哪种方式收窄范围？也可以直接输入更多线索。',
                options: ['优先查我的知识库', '优先查产品与设计', '保持当前范围']
            });
            renderChat(true);
            syncSession()
        } else {
            let g = guide;
            if (g.answers.some(a => a.includes('我的知识库'))) current.scope = ['personal'];
            if (g.answers.some(a => a.includes('产品与设计'))) current.scope = ['design'];
            if (g.answers.some(a => a.includes('图片'))) current.skills = [...new Set([...current.skills, '图片搜索'])];
            guide = null;
            await executeQuery(g.query + ' ' + g.answers.filter(a => !a.includes('范围') && !a.includes('优先')).join(' '), '直接检索', current.scope.length ? current.scope.map(libName).join('、') : '全部知识库')
        }
    }

    function openHistory(id) {
        if (busy) {
            toast('请等待当前检索完成');
            return
        }
        syncSession();
        const old = sessions.find(s => s.id === id);
        if (old) {
            current = JSON.parse(JSON.stringify(old));
            guide = null;
            const unfinished = current.messages.filter(m => m.type === 'guide' && !m.done);
            for (const m of unfinished) m.done = true;
            showChat();
            closePreview();
            renderChat(true)
        } else {
            current = {
                id,
                title: id === 'demo-rag' ? '如何让知识检索更可信？' : id === 'demo-design' ? '关于渐进式披露的设计原则' : '找一张极简设计的参考图',
                mode: id === 'demo-rag' ? 'RAG 检索' : '直接检索',
                scope: [],
                skills: id === 'demo-image' ? ['图片搜索'] : [],
                model: 'Qwen3 · 本地',
                tier: '均衡',
                messages: []
            };
            const found = id === 'demo-rag' ? [docs.find(d => d.id === 'd1'), docs.find(d => d.id === 'd5')] : id === 'demo-design' ? [docs.find(d => d.id === 'd2')] : [docs.find(d => d.id === 'd3')];
            const clean = found.filter(Boolean);
            addMessage({type: 'user', text: current.title, scope: '全部知识库', mode: current.mode});
            addMessage(id === 'demo-rag' ? {
                type: 'answer',
                query: current.title,
                ids: clean.map(d => d.id),
                answer: buildAnswer(current.title, clean),
                scope: '全部知识库',
                model: current.model
            } : {
                type: 'results',
                query: current.title,
                ids: clean.map(d => d.id),
                scope: '全部知识库',
                mode: '直接检索'
            });
            showChat();
            renderChat(true);
            syncSession()
        }
        attachment = null;
        renderAttachment();
        setSidebar(false)
    }

    function closePopover() {
        popover = '';
        $('#popover').className = 'popover';
        $('#popover').innerHTML = '';
        $$('[data-menu]').forEach(b => b.setAttribute('aria-expanded', 'false'))
    }

    function chatModelOptions() {
        const m = modelConfig.chat;
        return [...new Set([m.name + ' · ' + (m.type === '本地模型服务' ? '本地' : '私有服务'), 'Qwen3 · 本地', 'DeepSeek · 私有服务'])]
    }

    function openPopover(name) {
        if (popover === name) {
            closePopover();
            return
        }
        popover = name;
        const p = $('#popover');
        p.className = 'popover open ' + name;
        $$('[data-menu]').forEach(b => b.setAttribute('aria-expanded', b.dataset.menu === name ? 'true' : 'false'));
        if (name === 'scope') p.innerHTML = `<div class="popover-title">检索范围 · 支持多选</div><div class="menu-option"><input type="checkbox" id="scope-all" ${!current.scope.length ? 'checked' : ''} data-action="scope-all"><label for="scope-all">全部有权访问的知识库</label></div>` + libs.map(l => `<div class="menu-option"><input type="checkbox" id="scope-${l.id}" data-action="scope-check" data-id="${l.id}" ${current.scope.includes(l.id) ? 'checked' : ''}><label for="scope-${l.id}">${esc(l.name)}<span class="description">${l.type === 'personal' ? '个人知识库' : l.role}</span></label></div>`).join('') + '<div class="menu-footer">更改仅对后续消息生效，已发送结果保持不变。</div>';
        if (name === 'mode') p.innerHTML = '<div class="popover-title">选择检索方式</div>' + modes.map(([m, d]) => `<button type="button" class="menu-option ${current.mode === m ? 'active' : ''}" data-action="mode" data-mode="${m}">${icon(m === 'RAG 检索' ? 'spark' : 'search')}<span>${m}<span class="description">${d}</span></span>${current.mode === m ? icon('check', 'tick') : ''}</button>`).join('');
        if (name === 'model') p.innerHTML = '<div class="popover-title">对话模型</div>' + chatModelOptions().map(m => `<button type="button" class="menu-option ${current.model === m ? 'active' : ''}" data-action="model" data-model="${m}">${icon('spark')}<span>${m}<span class="description">示例模型 · 未接入实际服务</span></span>${current.model === m ? icon('check', 'tick') : ''}</button>`).join('') + `<div class="model-tier">${['轻快', '均衡', '深度'].map(t => `<button type="button" class="${current.tier === t ? 'active' : ''}" data-action="tier" data-tier="${t}">${t}</button>`).join('')}</div><div class="menu-footer">向量与重排模型在「实例设置」中配置。</div>`;
        if (name === 'add') p.innerHTML = `<button type="button" class="menu-option" data-action="upload">${icon('upload')}<span>上传资料<span class="description">PDF、Office、笔记与图片</span></span></button><button type="button" class="menu-option" data-action="image-file">${icon('image')}<span>以图搜图<span class="description">选择图片，查找相似内容</span></span></button>`;
        if (name === 'skills') p.innerHTML = '<div class="popover-title">为本次检索添加能力</div>' + ['联网搜索', '图片搜索'].map(s => `<button type="button" class="menu-option ${current.skills.includes(s) ? 'active' : ''}" data-action="skill-toggle" data-skill="${s}">${icon(s === '联网搜索' ? 'globe' : 'image')}<span>${s}<span class="description">${s === '联网搜索' ? '单独展示网络补充，不计入本地引用' : '图内文字、以文搜图与以图搜图'}</span></span>${current.skills.includes(s) ? icon('check', 'tick') : icon('plus', 'tick')}</button>`).join('') + `<button type="button" class="menu-option" disabled>${icon('spark')}<span>深度检索 <span class="tag oat">P1</span><span class="description">多步拆解与跨文档归纳 · 后续开放</span></span></button>`;
        p.querySelector('button,input')?.focus();
    }

    function renderAttachment() {
        $('#attachment').innerHTML = attachment ? `<div class="attachment">${attachment.dataUrl ? `<img src="${attachment.dataUrl}" alt="查询图片缩略图">` : icon('file')}<span>${esc(attachment.name)}</span><button type="button" data-action="remove-attachment" aria-label="移除查询图片">${icon('close')}</button></div>` : '';
        renderComposer()
    }

    function setImage(file) {
        if (!file || !/^image\/(png|jpeg|webp|bmp)$/.test(file.type)) {
            toast('请选择 PNG、JPG、WebP 或 BMP 图片', true);
            return
        }
        if (file.size > 10 * 1024 * 1024) {
            toast('原型预览支持 10 MB 以内的查询图片', true);
            return
        }
        const reader = new FileReader();
        reader.onload = () => {
            attachment = {name: file.name, image: true, dataUrl: reader.result};
            if (!current.skills.includes('图片搜索')) current.skills.push('图片搜索');
            renderAttachment();
            closePopover();
            $('#query').focus();
            toast('已添加查询图片，可补充描述后发送；相似结果为预置演示')
        };
        reader.readAsDataURL(file)
    }

    function showPreview(id) {
        const d = docs.find(d => d.id === id);
        if (!d) {
            toast('原文已删除或无权访问', true);
            return
        }
        if (d.status === '已删除') {
            toast('原文已删除，可在文档管理的回收站中恢复', true);
            return
        }
        if (!libs.some(l => l.id === d.lib)) {
            toast('无权访问该原文', true);
            return
        }
        preview = d;
        previewPage = d.page;
        contextExpanded = false;
        renderPreview();
        $('#drawer').classList.add('open');
        $('#workspace').classList.add('with-drawer');
        requestAnimationFrame(() => $('#drawer .icon-btn')?.focus())
    }

    function renderPreview() {
        const d = preview;
        if (!d) return;
        const match = previewPage === d.page;

    function showModal(title, description, body, onReady) {
        closePopover();
        if (!$('#modal-root').children.length) modalReturnFocus = document.activeElement;

    function closeModal() {

            toast('正在演示入库，请稍候');

        oneTimeToken = null;
        pendingUpload = [];
        modalReturnFocus?.focus?.();

    }

    function confirmAction(title, text, fn) {
        showModal(title, text, `<div class="form-actions"><button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" id="confirm-button">确认${title.startsWith('撤销') ? '撤销' : title.startsWith('移除') ? '移除' : title.includes('重置') ? '重置' : '删除'}</button></div>`, () => $('#confirm-button').onclick = () => {
            closeModal();

        })

    function openUpload() {
        pendingUpload = [];
        uploadTarget = current.scope.length === 1 && writable(current.scope[0]) ? current.scope[0] : 'personal';
        uploadStarted = false;
        renderUploadModal()
    }

    function renderUploadModal() {
        showModal('留住每一份灵感', '将文档、笔记或图片收进知识库。此处演示上传与解析流程，文件不会发送到服务器。', `<label class="field">保存到<select id="upload-target">${libs.filter(l => writable(l.id)).map(l => `<option value="${l.id}" ${uploadTarget === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label><button class="dropzone" type="button" id="upload-drop" data-action="pick-upload">${icon('upload')}<strong>点击选择，或把文件轻放在这里</strong><small>PDF、Word、PPT、Excel、TXT、Markdown 与图片<br>支持多文件选择</small></button><div id="upload-list">${pendingUpload.map((f, i) => `<div class="upload-row">${icon('file')}<span>${esc(f.name)}</span><small>${formatSize(f.size)}</small><button class="icon-btn" data-action="remove-upload" data-index="${i}" aria-label="移除${esc(f.name)}">${icon('close')}</button></div>`).join('')}</div><div id="upload-progress"></div><div class="form-actions"><button class="btn ghost" data-action="close-modal">稍后再说</button><button class="btn primary" data-action="start-upload" ${pendingUpload.length ? '' : 'disabled'}>开始入库${pendingUpload.length ? ' · ' + pendingUpload.length : ''}</button></div>`);
        const drop = $('#upload-drop');
        drop.ondragover = e => {
            e.preventDefault();
            drop.classList.add('dragging')
        };
        drop.ondragleave = () => drop.classList.remove('dragging');
        drop.ondrop = e => {
            e.preventDefault();
            collectFiles([...e.dataTransfer.files])
        }
    }

    function formatSize(n) {
        return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'
    }

    function collectFiles(files) {
        const accept = /\.(pdf|docx?|pptx?|xlsx?|txt|md|jpe?g|png|webp|bmp)$/i;
        const valid = files.filter(f => accept.test(f.name));
        if (valid.length !== files.length) toast('已跳过不支持的格式。请上传文档、笔记或常见图片。', true);
        for (const f of valid) if (!pendingUpload.some(p => p.name === f.name && p.size === f.size)) pendingUpload.push(f);
        renderUploadModal()
    }

    async function startUpload() {
        if (!pendingUpload.length || uploadStarted) return;
        uploadStarted = true;
        const target = $('#upload-target').value;
        if (!writable(target)) {
            uploadStarted = false;
            toast('当前知识库没有上传权限', true);
            return
        }
        const files = [...pendingUpload];
        const fresh = files.map(f => ({
            id: uuid(),
            title: f.name.replace(/\.[^.]+$/, ''),
            ext: f.name.split('.').at(-1).toLowerCase(),
            lib: target,
            status: '排队',
            date: '2026-10-16',
            size: formatSize(f.size),
            page: 1,
            pages: 1,
            section: '上传文件 · 原型演示',
            tags: f.name,
            text: '',
            context: '文件已在浏览器中完成模拟入库。当前原型不解析实际文件正文。',
            after: '可体验状态流转、删除、恢复与列表筛选。真实内容检索需要接入解析、索引和模型服务。'
        }));
        docs.push(...fresh);
        $('#upload-target').disabled = true;
        $$('#modal-root button').forEach(b => b.disabled = true);
        $('#upload-progress').innerHTML = '<div class="upload-progress"><div></div></div><p class="table-note" id="upload-state">排队 · 等待解析</p>';
        for (const state of ['解析中', '索引中', '可用']) {
            await new Promise(r => setTimeout(r, 700));
            fresh.forEach(d => d.status = state);
            $('#upload-state').textContent = state === '可用' ? '已完成模拟入库' : state + ' · 正在处理示例任务'
        }
        persist();
        renderNav();
        uploadStarted = false;
        closeModal();
        if (page === 'manage') renderManage(); else renderChat();
        toast(`${files.length} 份资料已完成模拟入库；未解析实际正文`)
    }

    function credentialModal() {
        showModal('为工具打开一扇门', '新凭证默认只读。访问范围始终跟随你当前有权访问的知识库。', `<form id="credential-form"><label class="field">凭证名称<input id="credential-name" required maxlength="50" placeholder="例如：我的 Codex"></label><label class="field">有效期<select id="credential-days"><option value="90">90 天 · 默认</option><option value="30">30 天</option><option value="7">7 天</option></select></label><div class="info-banner">${icon('lock')}<span>只读工具：search、search_images、ask、list_knowledge_bases。写入工具本期不开放。</span></div><div class="form-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" type="submit">创建演示凭证</button></div></form>`, () => $('#credential-form').onsubmit = e => {
            e.preventDefault();
            const name = $('#credential-name').value.trim();
            if (!name) {
                toast('请填写凭证名称', true);
                return
            }
            const days = Number($('#credential-days').value), date = new Date('2026-10-16T12:00:00+08:00');
            date.setDate(date.getDate() + days);
            credentials.push({
                id: uuid(),
                name,
                expires: date.toISOString().slice(0, 10),
                status: '有效',
                last: '尚未使用',
                tools: ['search', 'search_images', 'ask', 'list_knowledge_bases']
            });
            persist();
            oneTimeToken = 'DEMO_ONLY_' + uuid() + '_' + uuid();
            renderManage();
            showModal('你的连接已准备好', '这是无真实访问能力的演示令牌。仅展示这一次，关闭后无法重新查看。', `<div class="info-banner">${icon('shield')}<span>请妥善保管令牌。演示令牌不会保存至浏览器存储。</span></div><pre class="code-box" id="token-text">${esc(oneTimeToken)}</pre><div class="form-actions"><button class="btn" data-action="copy-token">${icon('copy')}复制演示令牌</button><button class="btn primary" data-action="close-modal">已妥善保存</button></div>`)
        })
    }

    function createLibrary() {
        showModal('给共同的知识，一个家', '创建共享知识库，与同伴一起整理与发现。', `<form id="library-form"><label class="field">知识库名称<input id="library-name" maxlength="50" required placeholder="例如：我们的研究室"></label><label class="field">说明 · 选填<textarea id="library-description" maxlength="200" placeholder="这里会收集哪些资料？"></textarea></label><div class="form-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button><button class="btn primary">创建知识库</button></div></form>`, () => $('#library-form').onsubmit = e => {
            e.preventDefault();
            const name = $('#library-name').value.trim();
            if (!name) {
                toast('请填写知识库名称', true);
                return
            }
            const l = {
                id: uuid(),
                name,
                type: 'shared',
                role: '所有者',
                description: $('#library-description').value.trim()
            };
            libs.push(l);
            members.push({name: '林予', role: '所有者', lib: l.id});
            memberLib = l.id;
            persist();
            closeModal();
            renderNav();
            showManage('members');
            toast('共享知识库已创建，可添加演示成员')
        })
    }

    function invite() {
        showModal('让知识，在彼此之间流动', '此原型不连接真实账号系统，提交后将添加本地演示成员。', `<form id="invite-form"><label class="field">用户名<input id="invite-name" required maxlength="30" placeholder="填写演示用户名"></label><label class="field">角色<select id="invite-role"><option>查看者</option><option>编辑者</option></select></label><div class="form-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button><button class="btn primary">添加演示成员</button></div></form>`, () => $('#invite-form').onsubmit = e => {
            e.preventDefault();
            const name = $('#invite-name').value.trim();
            if (!name) return;
            if (members.some(m => m.lib === memberLib && m.name === name)) {
                toast('该成员已在知识库中', true);
                return
            }
            members.push({name, role: $('#invite-role').value, lib: memberLib});
            persist();
            closeModal();
            renderManage();
            toast('演示成员已添加')
        })
    }

    async function copy(text) {
        try {
            await navigator.clipboard.writeText(text);
            toast('已复制到剪贴板')
        } catch {
            showModal('复制内容', '当前浏览器限制自动复制。选中下方内容即可手动复制。', `<textarea readonly class="code-box" style="width:100%;min-height:130px" id="manual-copy">${esc(text)}</textarea><div class="form-actions"><button class="btn primary" data-action="close-modal">完成</button></div>`, () => $('#manual-copy').select())
        }
    }

    function updateDocs() {
        persist();
        renderNav();
        if (page === 'manage' && tab === 'docs') renderManage()
    }

    async function retryDoc(d) {
        if (!d || !writable(d.lib) || d.status !== '失败') return;
        for (const status of ['排队', '解析中', '索引中', '可用']) {
            if (d.status === '已删除') return;
            d.status = status;
            updateDocs();
            await new Promise(r => setTimeout(r, 500))
        }
        toast('已完成模拟重试。实际文件解析结果取决于后端服务。')
    }

    document.addEventListener('click', async e => {
        const b = e.target.closest('[data-action]');
        if (!b) {
            if (!e.target.closest('#popover')) closePopover();
            return
        }
        const a = b.dataset.action, id = b.dataset.id;
        const d = docs.find(x => x.id === id);
        if (a !== 'popover' && !e.target.closest('#popover')) closePopover();
        switch (a) {
            case 'new-chat':
                newChat();
                break;
            case 'toggle-sidebar':
                setSidebar(!$('#sidebar').classList.contains('open'));
                break;
            case 'close-sidebar':
                setSidebar(false);
                break;
            case 'scope-single':
                current.scope = id ? [id] : [];
                renderNav();
                renderComposer();
                setSidebar(false);
                if (page !== 'chat') showChat();
                break;
            case 'history':
                openHistory(id);
                break;
            case 'popover':
                openPopover(b.dataset.menu);
                break;
            case 'scope-all':
                current.scope = [];
                renderNav();
                renderComposer();
                popover = '';
                openPopover('scope');
                break;
            case 'scope-check':
                if (b.checked) current.scope.push(id); else current.scope = current.scope.filter(x => x !== id);
                renderNav();
                renderComposer();
                const was = popover;
                popover = '';
                openPopover(was);
                break;
            case 'mode':
                current.mode = b.dataset.mode;
                closePopover();
                renderComposer();
                syncSession();
                $('#query').focus();
                break;
            case 'model':
                current.model = b.dataset.model;
                closePopover();
                renderComposer();
                syncSession();
                break;
            case 'tier':
                current.tier = b.dataset.tier;
                closePopover();
                renderComposer();
                syncSession();
                break;
            case 'skill-remove':
                current.skills = current.skills.filter(s => s !== b.dataset.skill);
                renderComposer();
                syncSession();
                break;
            case 'skill-toggle':
                current.skills = current.skills.includes(b.dataset.skill) ? current.skills.filter(s => s !== b.dataset.skill) : [...current.skills, b.dataset.skill];
                renderComposer();
                popover = '';
                openPopover('skills');
                syncSession();
                break;
            case 'shuffle':
                suggestionIndex++;
                renderChat();
                break;
            case 'suggest':
                current.mode = b.dataset.mode;
                if (b.dataset.image === 'true' && !current.skills.includes('图片搜索')) current.skills.push('图片搜索');
                showChat();
                await sendQuery(b.dataset.query);
                break;
            case 'image-start':
                if (!current.skills.includes('图片搜索')) current.skills.push('图片搜索');
                renderComposer();
                $('#query').value = '';
                $('#query').focus();
                toast('已开启图片搜索：输入描述，或从「＋」选择图片');
                break;
            case 'image-file':
                $('#image-input').click();
                closePopover();
                break;
            case 'remove-attachment':
                attachment = null;
                renderAttachment();
                break;
            case 'preview':
                showPreview(id);
                break;
            case 'close-preview':
                closePreview();
                $('#query').focus();
                break;
            case 'preview-prev':
                if (preview && previewPage > 1) {
                    previewPage--;
                    renderPreview()
                }
                break;
            case 'preview-next':
                if (preview && previewPage < preview.pages) {
                    previewPage++;
                    renderPreview()
                }
                break;
            case 'preview-hit':
                previewPage = preview.page;
                renderPreview();
                break;
            case 'preview-context':
                contextExpanded = !contextExpanded;
                renderPreview();
                break;
            case 'preview-new':
                previewNew();
                break;
            case 'manage':
                showManage(b.dataset.tab);
                break;
            case 'manage-tab':
                tab = b.dataset.tab;
                renderManage();
                break;
            case 'back-chat':
                showChat();
                break;
            case 'upload':
                openUpload();
                break;
            case 'pick-upload':
                $('#upload-input').click();
                break;
            case 'remove-upload':
                pendingUpload.splice(Number(b.dataset.index), 1);
                renderUploadModal();
                break;
            case 'start-upload':
                await startUpload();
                break;
            case 'close-modal':
                closeModal();
                break;
            case 'create-credential':
                credentialModal();
                break;
            case 'copy-token':
                if (oneTimeToken) await copy(oneTimeToken);
                break;
            case 'config-client':
                lastConfigClient = b.dataset.client;
                renderManage();
                break;
            case 'copy-config':
                await copy(config());
                break;
            case 'revoke':
                confirmAction('撤销凭证', '撤销后，该凭证将立即无法继续调用。此操作不可恢复。', () => {
                    credentials.find(c => c.id === id).status = '已撤销';
                    persist();
                    renderManage();
                    toast('凭证已撤销（演示）')
                });
                break;
            case 'create-library':
                createLibrary();
                break;
            case 'invite':
                invite();
                break;
            case 'remove-member':
                confirmAction('移除成员', `移除「${b.dataset.name}」后，该成员与其 MCP 凭证将无法访问此共享库。`, () => {
                    members = members.filter(m => !(m.lib === memberLib && m.name === b.dataset.name));
                    persist();
                    renderManage();
                    toast('演示成员已移除')
                });
                break;
            case 'delete-library':
                if (libs.find(l => l.id === id)?.role !== '所有者') break;
                confirmAction('删除共享知识库', `「${libName(id)}」的内容将对所有成员不可见。请确认已保留需要的资料。`, () => {
                    libs = libs.filter(l => l.id !== id);
                    docs = docs.filter(d => d.lib !== id);
                    members = members.filter(m => m.lib !== id);
                    current.scope = current.scope.filter(s => s !== id);
                    persist();
                    renderNav();
                    renderManage();
                    toast('共享知识库已删除')
                });
                break;
            case 'delete-doc':
                if (!d || !writable(d.lib)) break;
                confirmAction('删除文档', `「${d.title}」将移至回收站，30 天内可恢复。`, () => {
                    d.previousStatus = d.status;
                    d.status = '已删除';
                    d.deletedAt = '2026-10-16';
                    updateDocs();
                    toast('已移至回收站')
                });
                break;
            case 'restore-doc':
                if (!d || !writable(d.lib)) break;
                d.status = d.previousStatus || '可用';
                updateDocs();
                toast('文档已恢复');
                break;
            case 'purge-doc':
                if (!d || !writable(d.lib)) break;
                confirmAction('彻底删除文档', '这将从原型本地存储中移除此文件记录，无法恢复。', () => {
                    docs = docs.filter(x => x.id !== id);
                    updateDocs();
                    toast('已彻底删除')
                });
                break;
            case 'retry-doc':
                await retryDoc(d);
                break;
            case 'guide-choice':
                if (!guide || current.messages.find(m => m.id === id)?.done) break;
                await sendQuery(b.dataset.value);
                break;
            case 'guide-skip':
                if (!guide || current.messages.find(m => m.id === id)?.done) break;
                const g = guide;
                current.messages.filter(m => m.type === 'guide').forEach(m => m.done = true);
                guide = null;
                await executeQuery(g.query, '直接检索', current.scope.length ? current.scope.map(libName).join('、') : '全部知识库');
                break;
            case 'broaden':
                current.scope = [];
                current.mode = '模糊检索';
                current.skills = [];
                renderNav();
                renderComposer();
                await sendQuery(b.dataset.query);
                break;
            case 'copy-answer':
                const m = current.messages.find(m => m.id === id);
                if (m) {
                    const tmp = document.createElement('div');
                    tmp.innerHTML = m.answer;
                    await copy(tmp.textContent)
                }
                break;
            case 'feedback':
                const ans = current.messages.find(m => m.id === id);
                if (ans) {
                    ans.feedback = !ans.feedback;
                    syncSession();
                    renderChat();
                    toast(ans.feedback ? '已记录“有帮助”的反馈' : '已撤回反馈')
                }
                break;
            case 'test-model':
                const form = b.closest('form');
                if (!form.reportValidity()) break;
                b.disabled = true;
                b.textContent = '检查中…';
                await new Promise(r => setTimeout(r, 600));
                b.disabled = false;
                b.textContent = '测试连接';
                $('#model-state-' + id).textContent = '演示检查通过';
                $('#model-result-' + id).textContent = '仅检查字段格式，未发起实际服务请求';
                toast('演示检查通过，未调用模型服务');
                break;
            case 'reset':
                confirmAction('重置演示', '将清除当前浏览器中保存的原型修改，恢复初始示例数据。', () => {
                    try {
                        localStorage.removeItem(STORE)
                    } catch {
                    }
                    location.reload()
                });
                break;
        }
    });
    document.addEventListener('change', e => {
        const t = e.target;
        if (t.id === 'doc-filter') {
            docFilter = t.value;
            renderManage()
        }
        if (t.id === 'member-lib') {
            memberLib = t.value;
            renderManage()
        }
        if (t.id === 'upload-target') uploadTarget = t.value;
        if (t.dataset.action === 'member-role') {
            const m = members.find(m => m.lib === memberLib && m.name === t.dataset.name);
            if (m) {
                m.role = t.value;
                persist();
                toast('成员角色已更新（演示）')
            }
        }
    });
    document.addEventListener('input', e => {
        if (e.target.id === 'query') renderComposer();
        if (e.target.id === 'doc-search') {
            docSearch = e.target.value;
            const selection = e.target.selectionStart;
            $('#manage-body').innerHTML = docsHTML();
            const input = $('#doc-search');
            input.focus();
            input.setSelectionRange(selection, selection)
        }
    });
    document.addEventListener('submit', e => {
        if (e.target.classList.contains('model-form')) {
            e.preventDefault();
            const f = e.target;
            if (f.reportValidity()) {
                const save = () => {
                    modelConfig[f.dataset.kind] = {
                        name: f.elements.model.value.trim(),
                        url: f.elements.url.value.trim(),
                        type: f.elements.type.value
                    };
                    if (f.dataset.kind === 'chat') current.model = modelConfig.chat.name + ' · ' + (modelConfig.chat.type === '本地模型服务' ? '本地' : '私有服务');
                    persist();
                    f.elements.key.value = '';
                    renderComposer();
                    toast('模型演示配置已保存，未连接实际服务')
                };
                if (f.dataset.kind === 'embedding') confirmActionModel(save); else save()
            }
        }
    });

    function confirmActionModel(fn) {
        showModal('更新向量模型', '更换向量模型需要重建索引。此原型仅演示设置流程，不执行真实重建。', `<div class="form-actions"><button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" id="save-vector">保存演示配置</button></div>`, () => $('#save-vector').onclick = () => {
            closeModal();
            fn()
        })
    }

    $('#composer').onsubmit = e => {
        e.preventDefault();
        sendQuery()
    };
    $('#query').onkeydown = e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            sendQuery()
        }
    };
    $('#upload-input').onchange = e => {
        collectFiles([...e.target.files]);
        e.target.value = ''
    };
    $('#image-input').onchange = e => {
        setImage(e.target.files[0]);
        e.target.value = ''
    };
    $('#composer').ondragover = e => {
        e.preventDefault();
        $('#composer').classList.add('dragging')
    };
    $('#composer').ondragleave = () => $('#composer').classList.remove('dragging');
    $('#composer').ondrop = e => {
        e.preventDefault();
        $('#composer').classList.remove('dragging');
        const f = e.dataTransfer.files[0];
        if (f?.type.startsWith('image/')) setImage(f); else if (f) {
            openUpload();
            collectFiles([...e.dataTransfer.files])
        }
    };
    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            newChat();
            $('#query').focus()
        }
        if (e.key === 'Escape') {
            if ($('#modal-root').children.length) closeModal(); else if (popover) {
                closePopover();
                $('#query').focus()
            } else if (preview) closePreview(); else setSidebar(false)
        }
        if (e.key === 'Tab' && $('#modal-root').children.length) {
            const modal = $('#modal-root .modal');
            const focus = [...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')];
            const first = focus[0], last = focus.at(-1);
            if (e.shiftKey && (document.activeElement === first || document.activeElement === modal)) {
                e.preventDefault();
                last?.focus()
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first?.focus()
            }
        }
    });
    renderNav();
    renderChat();
</script>
</body>
</html>
