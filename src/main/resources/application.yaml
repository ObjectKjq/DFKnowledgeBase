server:
  port: 8080
  servlet:
    context-path: /api
--- ################### 应用配置 ###################
spring:
  application:
    name: knowledge-base
  profiles:
    active: local

--- ################### 文件上传 ###################
spring:
  servlet:
    multipart:
      # multipart 上限与业务上限对齐（单文件 50 MB，服务层校验并给出业务错误码）；超出时由全局异常处理给出同一文案提示
      max-file-size: 50MB
      max-request-size: 55MB

--- ################### 文档存储 ###################
knowledge:
  doc:
    # 文档落盘根目录，存储路径 = 根目录/知识库编号/随机文件名.扩展名
    storage-path: ./data/docs
  elasticsearch:
    # 索引须先由部署者执行 es/ 中的 DSL 创建，应用不会自动创建或修改 mapping
    url: ${ES_URL:http://localhost:9200}
    index-name: ${ES_INDEX:knowledge_doc_chunk}

--- ################### MyBatis-Plus ###################
mybatis-plus:
  # Mapper XML 位置
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

--- ################### sa-token ###################
sa-token:
  # 令牌名称与前端前缀（Authorization: Bearer xxx）
  token-name: Authorization
  token-prefix: Bearer
  # 令牌有效期 7 天（秒）
  timeout: 604800
  # 活跃续签：2 小时内有操作则续签
  active-timeout: 7200
  # 允许同一账号多端同时在线，每次登录签发独立令牌
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
