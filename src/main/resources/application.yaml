server:
  port: 8080
  servlet:
    context-path: /api
--- ################### 应用配置 ###################
spring:
  application:
    name: knowledge-base
  profiles:
    active: local
  elasticsearch:
    uris: ${ES_URL:http://localhost:9200}
  http:
    converters:
      preferred-json-mapper: jackson2

--- ################### 文件上传 ###################
spring:
  servlet:
    multipart:
      # multipart 上限与业务上限对齐（单文件 50 MB，服务层校验并给出业务错误码）；超出时由全局异常处理给出同一文案提示
      max-file-size: 50MB
      max-request-size: 55MB

--- ################### 业务配置 ###################
knowledge:
  elasticsearch:
    # 索引须先由部署者执行 es/ 中的 DSL 创建，应用不会自动创建或修改 mapping
    index-name: ${ES_INDEX:knowledge_doc_chunk}
  rag:
    # OpenAI 兼容对话模型；未配置时 RAG 检索返回明确错误，不静默降级
    base-url: ${CHAT_MODEL_BASE_URL:}
    api-key: ${CHAT_MODEL_API_KEY:}
    model: ${CHAT_MODEL_NAME:}
    # 整次流式问答的超时（毫秒），到期发送 error 事件并保留问题供重试
    stream-timeout-ms: 65000

--- ################### MyBatis-Plus ###################
mybatis-plus:
  # Mapper XML 位置
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 权限和文档状态复查须真正执行SELECT，不能复用同一事务中外部调用前的查询结果。
    local-cache-scope: STATEMENT
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

--- ################### sa-token ###################
sa-token:
  # 令牌名称与前端前缀（Authorization: Bearer xxx）
  token-name: Authorization
  token-prefix: Bearer
  # 令牌有效期 7 天（秒）
  timeout: 604800
  # 活跃续签：2 小时内有操作则续签
  active-timeout: 7200
  # 允许同一账号多端同时在线，每次登录签发独立令牌
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
